apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: reflectlogixai-api
  labels:
    cloud.googleapis.com/location: asia-southeast1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: reflectlogixai-runner@appspot.gserviceaccount.com
      containers:
      - image: gcr.io/reflectlogixai-prod/api:latest
        ports:
        - name: http1
          containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: GEMINI_API_KEY
              key: latest
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
