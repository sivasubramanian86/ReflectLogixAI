name: CI Security, Quality & 100% Coverage Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  typescript-lint-test-build:
    name: TypeScript Lint, Vitest & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: TypeScript Type Check (100% Strict)
        run: npm run lint

      - name: Run Vitest Suite (Frontend & Backend)
        run: npm test

      - name: Production Bundle Build
        run: npm run build

  python-quality-and-coverage:
    name: Python ADK Multi-Agent Quality (Ruff, Bandit, 100% Coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies & Quality Tooling
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov ruff bandit
          if [ -f agents/requirements.txt ]; then pip install -r agents/requirements.txt; fi

      - name: Run Ruff Static Linter
        run: python -m ruff check agents/

      - name: Run Bandit SAST Security Vulnerability Scan
        run: python -m bandit -r agents/ -s B101

      - name: Enforce 100% Pytest Code Coverage Rule
        env:
          PYTHONPATH: .
        run: |
          python -m pytest agents/tests/ --cov=agents --cov-fail-under=100 --cov-report=term-missing

  security-scan:
    name: Gitleaks Secret & SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detector
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
