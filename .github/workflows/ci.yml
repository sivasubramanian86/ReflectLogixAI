name: CI Security & Quality Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: TypeScript Lint, Vitest & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npm run lint

      - name: Run Vitest Suite (Frontend & Backend)
        run: npm test

      - name: Production Bundle Build
        run: npm run build

  python-agents-test:
    name: Python ADK Multi-Agent Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Agent Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f agents/requirements.txt ]; then pip install -r agents/requirements.txt; fi

      - name: Execute Pytest Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest agents/tests/ -v

  security-scan:
    name: Gitleaks Secret & SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detector
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
