name: Deploy to Google Cloud Run

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Google Cloud Region'
        required: true
        default: 'asia-southeast1'
      project_id:
        description: 'Google Cloud Project ID'
        required: true
        default: 'genai-apac-2026-491004'
  push:
    branches: [ main ]
    paths:
      - 'apps/**'
      - 'infra/**'
      - 'Dockerfile'
      - 'server.ts'
      - '.github/workflows/deploy-cloudrun.yml'

jobs:
  deploy:
    name: Build & Deploy Cloud Run Service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      GCP_PROJECT: ${{ github.event.inputs.project_id || 'genai-apac-2026-491004' }}
      GCP_REGION: ${{ github.event.inputs.region || 'asia-southeast1' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: env.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: env.WIF_PROVIDER != ''
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 460.0.0'

      - name: Deploy ReflectLogixAI to Cloud Run
        if: env.WIF_PROVIDER != ''
        run: |
          gcloud run deploy reflectlogixai-journal \
            --source . \
            --project ${{ env.GCP_PROJECT }} \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --port 3000 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --set-labels dev-tutorial=cloud-run-ai-challenge \
            --set-env-vars NODE_ENV=production,GOOGLE_CLOUD_PROJECT=${{ env.GCP_PROJECT }},GOOGLE_CLOUD_LOCATION=${{ env.GCP_REGION }},USE_VERTEX_AI=true,GEMINI_MODEL=gemini-3.7-flash
