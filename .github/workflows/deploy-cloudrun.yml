name: Deploy to Google Cloud Run

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/898481937082/locations/global/workloadIdentityPools/github/providers/my-repo
          service_account: reflectlogixai-deployer@reflectlogixai.iam.gserviceaccount.com
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Build & Deploy Web & API
        run: |
          gcloud run deploy reflectlogixai-api \
            --source . \
            --region asia-southeast1 \
            --allow-unauthenticated \
            --port 3000
