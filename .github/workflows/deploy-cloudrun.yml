name: Deploy to Google Cloud Run

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Cloud Run Service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/898481937082/locations/global/workloadIdentityPools/github/providers/my-repo
          service_account: reflectlogixai-deployer@reflectlogixai.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 460.0.0'

      - name: Deploy ReflectLogixAI to Cloud Run
        run: |
          gcloud run deploy reflectlogixai-journal \
            --source . \
            --region asia-southeast1 \
            --allow-unauthenticated \
            --port 3000 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars NODE_ENV=production,GEMINI_MODEL=gemini-3.7-flash
